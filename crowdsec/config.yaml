name: "Crowdsec"
description: "CrowdSec - the open-source and participative IPS"
url: "https://github.com/crowdsecurity/home-assistant-addons/blob/main/crowdsec/DOCS.md"
version: "1.7.8-1"
slug: "crowdsec"
init: false
ingress: true
ingress_port: 7681
ingress_stream: true
arch:
  - amd64
  - armhf
  - aarch64
  - armv7
  - i386
ports:
  8080/tcp: null
  6060/tcp: 6060
ports_description:
  8080/tcp: "CrowdSec Local API"
  6060/tcp: "CrowdSec Prometheus metrics (only used if enable_metrics is true; published by default so it works out of the box once enabled, can be remapped/disabled via this add-on's Network settings)"
image: "ghcr.io/crowdsecurity/{arch}-addon-crowdsec"
options:
  acquisition: |
    ---
    source: journalctl
    journalctl_filter: 
      - "--directory=/var/log/journal/"
    labels:
      type: syslog
  disable_lapi: false
  remote_lapi_url: ""
  agent_username: ""
  agent_password: ""
  collections:
    - crowdsecurity/home-assistant
  parsers: []
  scenarios: []
  postoverflows: []
  parsers_to_disable: []
  scenarios_to_disable: []
  disable_online_api: false
  enable_metrics: false
  metrics_listen_addr: "0.0.0.0"
environment:
  CONFIG_FILE: "/config/.storage/crowdsec/config/config.yaml"
schema:
  acquisition: str
  disable_lapi: bool
  remote_lapi_url: str
  agent_username: str
  agent_password: str
  collections:
    - str
  parsers:
    - str
  scenarios:
    - str
  postoverflows:
    - str
  parsers_to_disable:
    - str
  scenarios_to_disable:
    - str
  disable_online_api: bool
  enable_metrics: bool
  metrics_listen_addr: str
map:
  - config:rw
panel_icon: mdi:console-network
panel_title: Crowdsec Terminal
journald: true
