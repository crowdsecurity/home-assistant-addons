# Ingress entrypoint for the CrowdSec add-on web UI.
#   /           -> static web UI
#   /api/       -> cscli JSON API (python, 127.0.0.1:8099)
#   /terminal/  -> ttyd web terminal (127.0.0.1:7682)
user root;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7681 default_server;

        # Only the Home Assistant ingress proxy may talk to us
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        root /opt/webui/static;
        index index.html;

        location = / {
            add_header Cache-Control "no-cache";
            try_files /index.html =404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8099;
            proxy_http_version 1.1;
            proxy_read_timeout 180s;
            client_max_body_size 64k;
        }

        location /terminal/ {
            proxy_pass http://127.0.0.1:7682/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
